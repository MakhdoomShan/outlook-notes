<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Email Notes</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<style>
  :root{color-scheme:light dark;--bg:#fff;--fg:#201f1e;--mut:#6b6b6b;--bd:#c8c6c4;--ac:#0078d4}
  @media (prefers-color-scheme:dark){:root{--bg:#1f1f1f;--fg:#f3f2f1;--mut:#a0a0a0;--bd:#484644}}
  html,body{height:100%;margin:0}
  body{font:14px Segoe UI,system-ui,sans-serif;background:var(--bg);color:var(--fg);padding:10px;box-sizing:border-box;display:flex;flex-direction:column;gap:8px}
  #subj{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  textarea{width:100%;box-sizing:border-box;background:var(--bg);color:var(--fg);border:1px solid var(--bd);border-radius:4px;padding:8px;font:inherit;resize:vertical}
  #note{flex:1;min-height:140px}
  #out{height:120px}
  .row{display:flex;justify-content:space-between;align-items:center;gap:6px;color:var(--mut);font-size:12px}
  button{background:var(--ac);color:#fff;border:0;border-radius:4px;padding:6px 10px;cursor:pointer;font:inherit}
  button.sec{background:transparent;color:var(--ac);border:1px solid var(--ac)}
  .warn{color:#d13438}
</style>
</head>
<body>
<div id="subj">Email Notes</div>
<textarea id="note" placeholder="Type a note for this email…" dir="auto"></textarea>
<div class="row"><span id="status">Ready</span><span id="usage"></span></div>
<div class="row"><button id="copy">Copy all notes</button><button id="dl" class="sec">Download .txt</button></div>
<textarea id="out" hidden readonly></textarea>

<script>
const LIMIT = 32768, KEY = "notes";
let rs, store = {}, curKey = null, curMeta = {s:"",d:""}, timer = null, dirty = false;
const $ = id => document.getElementById(id);
const bytes = o => new Blob([JSON.stringify(o)]).size;

function hash(str){ // cyrb53
  let h1=0xdeadbeef, h2=0x41c6ce57;
  for (let i=0,c;i<str.length;i++){ c=str.charCodeAt(i); h1=Math.imul(h1^c,2654435761); h2=Math.imul(h2^c,1597334677); }
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return (4294967296*(2097151&h2)+(h1>>>0)).toString(36);
}

function readItem(){
  const it = Office.context.mailbox.item;
  if (!it) return null;
  const id = it.internetMessageId || it.conversationId || it.itemId;
  if (!id) return null;
  return { key: hash(id), subject: it.subject || "(no subject)",
           date: it.dateTimeCreated ? new Date(it.dateTimeCreated).toISOString().slice(0,10) : "" };
}

function setStatus(msg, bad){ const s=$("status"); s.textContent=msg; s.className=bad?"warn":""; }
function showUsage(){ const b=bytes(store); $("usage").textContent=(b/1024).toFixed(1)+" / 32 KB"; $("usage").className=b>LIMIT*0.85?"warn":""; }

function flush(){
  clearTimeout(timer);
  if (!dirty || !curKey) return;
  const next = Object.assign({}, store), t = $("note").value;
  if (t.trim()) next[curKey] = { s:curMeta.s, d:curMeta.d, t:t, u:Date.now() }; else delete next[curKey];
  if (bytes(next) > LIMIT - 500) { setStatus("Storage full. Export, then delete old notes.", true); return; }
  store = next; dirty = false;
  rs.set(KEY, store);
  rs.saveAsync(r => { setStatus(r.status===Office.AsyncResultStatus.Succeeded ? "Saved" : "Save failed", r.status!==Office.AsyncResultStatus.Succeeded); });
  showUsage();
}

function showItem(){
  flush();
  const it = readItem();
  if (!it) { curKey=null; $("subj").textContent="Select an email"; $("note").value=""; $("note").disabled=true; return; }
  curKey = it.key; curMeta = { s:it.subject, d:it.date };
  $("subj").textContent = it.subject; $("subj").title = it.subject;
  $("note").disabled = false;
  $("note").value = store[curKey] ? store[curKey].t : "";
  dirty = false; setStatus("Ready"); showUsage();
}

function allText(){
  return Object.values(store).sort((a,b)=>b.u-a.u)
    .map(n => n.s + (n.d ? " (" + n.d + ")" : "") + "\n" + n.t).join("\n\n----------\n\n");
}
function showOut(txt){ const o=$("out"); o.hidden=false; o.value=txt; o.select(); }

$("copy").onclick = async () => {
  flush(); const txt = allText();
  if (!txt) return setStatus("No notes yet");
  try { await navigator.clipboard.writeText(txt); setStatus("Copied"); }
  catch(e){ showOut(txt); setStatus("Press Ctrl+C to copy"); }
};
$("dl").onclick = () => {
  flush(); const txt = allText();
  if (!txt) return setStatus("No notes yet");
  try {
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([txt],{type:"text/plain"}));
    a.download="outlook-notes.txt"; document.body.appendChild(a); a.click(); a.remove();
    setStatus("Downloaded");
  } catch(e){ showOut(txt); setStatus("Press Ctrl+C to copy"); }
};

$("note").addEventListener("input", () => { dirty = true; setStatus("Typing…"); clearTimeout(timer); timer = setTimeout(flush, 700); });
$("note").addEventListener("blur", flush);
document.addEventListener("visibilitychange", () => { if (document.hidden) flush(); });

Office.onReady(() => {
  rs = Office.context.roamingSettings;
  let s = rs.get(KEY);
  if (typeof s === "string") { try { s = JSON.parse(s); } catch(e){ s = {}; } }
  store = s || {};
  showItem();
  Office.context.mailbox.addHandlerAsync(Office.EventType.ItemChanged, showItem);
});
</script>
</body>
</html>
